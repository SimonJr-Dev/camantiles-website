<script>

    var tag = node.tagName.toLowerCase();
    if (tag === 'sc-for') {
      var lp = single(node.getAttribute('list') || '');

      list.forEach(function(it, i){

"The Camantiles of today is very different from the community of generations ago. It is now an urban barangay of Urdaneta City, with thousands of residents and an increasingly connected position within the city.": "Ibang-iba na ang Camantiles ngayon kumpara sa komunidad ng mga nakaraang henerasyon. Isa na itong urban na barangay ng Lungsod ng Urdaneta, may libu-libong residente at lalong nagiging konektado sa loob ng lungsod.",
"The Day Care Center provides early childhood care and development for the children of Camantiles, supported by the barangay. Children learn through play, songs, stories and simple activities that prepare them for kindergarten.": "Nagbibigay ang Day Care Center ng pangangalaga at paghubog sa maagang pagkabata para sa mga bata ng Camantiles, sa suporta ng barangay. Natututo ang mga bata sa pamamagitan ng laro, awit, kuwento at mga simpleng gawain na naghahanda sa kanila para sa kindergarten.",
"The community changed gradually. What may once have been recognized primarily through its landscape became a neighborhood, then a barangay, and eventually one of the city's important urban communities.": "Unti-unting nagbago ang komunidad. Ang dating maaaring nakikilala lamang sa kanyang tanawin ay naging isang pamayanan, pagkatapos ay isang barangay, at kalaunan ay isa sa mahahalagang urban na komunidad ng lungsod.",
"The development of major roads has further connected Camantiles to the wider Urdaneta landscape. The former Urdaneta City Bypass Road, which passes through Camantiles and neighboring barangays, was officially renamed Ambassador Eduardo “Danding” M. Cojuangco Jr. Avenue in 2024.": "Lalong naiugnay ng pagpapaunlad ng malalaking kalsada ang Camantiles sa mas malawak na Urdaneta. Ang dating Urdaneta City Bypass Road, na dumaraan sa Camantiles at mga kalapit na barangay, ay opisyal na pinalitan ng pangalang Ambassador Eduardo “Danding” M. Cojuangco Jr. Avenue noong 2024.",
"The exact founding story of Barangay Camantiles is not fully preserved in publicly available municipal records. Unlike some neighboring barangays whose histories have been documented through submitted barangay profiles, Camantiles' historical profile in the city's online planning archive remains undocumented.": "Ang eksaktong kuwento ng pagkakatatag ng Barangay Camantiles ay hindi lubos na naitala sa mga pampublikong rekord ng munisipyo. Hindi tulad ng ilang kalapit na barangay na naidokumento ang kasaysayan sa pamamagitan ng isinumiteng barangay profile, ang makasaysayang profile ng Camantiles sa online planning archive ng lungsod ay nananatiling walang tala.",
"The history of a barangay is rarely made by one person. It is made by residents who volunteer. Teachers who educate. Farmers who provide. Parents who raise families. Workers who leave home each morning and return at night. Young people who imagine a better future. And community leaders who accept the responsibility of representing their neighbors.": "Bihirang mabuo ng iisang tao ang kasaysayan ng isang barangay. Binubuo ito ng mga residenteng nagboboluntaryo. Ng mga gurong nagtuturo. Ng mga magsasakang nagtataguyod. Ng mga magulang na nagpapalaki ng pamilya. Ng mga manggagawang umaalis tuwing umaga at umuuwi sa gabi. Ng mga kabataang nangangarap ng mas magandang kinabukasan. At ng mga pinuno ng komunidad na tumatanggap ng responsibilidad na kumatawan sa kanilang mga kapitbahay.",
"The name “Camantiles” carries a beautiful connection to the land.": "Ang pangalang “Camantiles” ay may magandang ugnayan sa lupa.",
"The people who carried Camantiles forward": "Ang mga taong nagdala sa Camantiles pasulong",
"The people who carried it forward": "Ang mga nagdala nito pasulong",
"The people who shaped Camantiles were part of the larger movement that shaped Urdaneta. Families built homes. Farmers worked the land. Children grew up along roads that would eventually become part of a more connected and urban Urdaneta.": "Ang mga taong humubog sa Camantiles ay bahagi ng mas malawak na kilusang humubog sa Urdaneta. Nagtayo ng tahanan ang mga pamilya. Binungkal ng mga magsasaka ang lupa. Lumaki ang mga bata sa tabi ng mga daang kalaunan ay naging bahagi ng mas konektado at urban na Urdaneta.",
"The school began as Camantiles Barangay High School and was later placed under the national education system following Executive Order 189 in 1987.": "Nagsimula ang paaralan bilang Camantiles Barangay High School at kalaunan ay isinailalim sa pambansang sistema ng edukasyon alinsunod sa Executive Order 189 noong 1987.",
"The yearly celebration with a program, awarding of outstanding alumni and a fellowship night.": "Ang taunang pagdiriwang na may programa, pagkilala sa mga natatanging alumni at gabi ng pagsasama-sama.",
"Those answers deserve to be heard—not guessed. Because history belongs to the people who lived it. And perhaps the next chapter of Camantiles' story begins by asking its oldest residents to tell what they remember.": "Ang mga sagot na iyon ay nararapat na mapakinggan—hindi hulaan. Dahil ang kasaysayan ay pag-aari ng mga taong nabuhay rito. At marahil ang susunod na kabanata ng kuwento ng Camantiles ay magsisimula sa pagtatanong sa mga pinakanakatatandang residente kung ano ang kanilang naaalala.",
"Thursday": "Huwebes",
"Today, Camantiles is officially classified as an urban barangay and has more than 6,500 residents.": "Sa kasalukuyan, opisyal na nakauri ang Camantiles bilang urban na barangay at may higit sa 6,500 residente.",
"Today, another generation of leaders carries that responsibility forward. And that is perhaps the most important lesson of Camantiles:": "Ngayon, isa pang henerasyon ng mga pinuno ang nagdadala ng responsibilidad na iyon. At iyon marahil ang pinakamahalagang aral ng Camantiles:",
